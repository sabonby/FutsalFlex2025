<!DOCTYPE html>

    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.10.25/css/jquery.dataTables.min.css">

     <style>
        .responsive-container {
            position: relative;
            overflow: hidden;
        }

        .responsive-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
         /* Media query for screens smaller than 600px */
        @media (max-width: 600px) {
            .responsive-container {
                padding-top: 0;
                height: auto;
            }

            .responsive-container iframe {
                position: static;
                width: 100%;
                height: 100vh;
            }
        }
         .bracket {
            padding-bottom: 100%;
        }
         .bracket, .top-score {
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #fff;
            margin-bottom: 20px;
        }

        .bracket h2, .top-score h2 {
            margin-bottom: 15px;
            color: #007bff;
        }

        .bracket table, .top-score table {
            width: 100%;
            border-collapse: collapse;
        }

        .bracket table th, .bracket table td, .top-score table th, .top-score table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }

        .bracket table th, .top-score table th {
            background-color: #007bff;
            color: #fff;
        }
    </style>
